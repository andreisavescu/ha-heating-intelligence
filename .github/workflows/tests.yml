name: Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  room-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Check Lovelace card JavaScript syntax
        run: node --check custom_components/heating_intelligence/www/heating-intelligence-card.js
      - name: Run unit tests
        run: python -m pytest -q
